<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tajmir Group Letterhead</title>
    <!-- Logo fonts (Montserrat, Fira Sans, Noto Serif, Noto Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,700;1,400&family=Montserrat:wght@400;500;700&family=Noto+Sans&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
    <!-- Keep Tailwind CDN for simplicity to match existing styling logic -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tajmir: {
                gold: '#b8860b',
                dark: '#2c2c2c',
                gray: '#525659'
              }
            },
            fontFamily: {
              serif: ['Georgia', 'Times New Roman', 'serif'],
              sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Print Overrides */
      @media print {
        @page { size: A4; margin: 0; }
        body { background-color: white; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        /* Ensure background graphics print */
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "@heroicons/react/": "https://aistudiocdn.com/@heroicons/react@^2.2.0/",
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#333] overflow-hidden">
    <div id="root"></div>
    <!-- CRITICAL: Entry point for Vite build -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
